spring.application.name=PortalMulheresNaCiencia

# Conexão com o MySQL. Os valores vêm de variáveis de ambiente; o que está depois de ":" é o padrão local.
# Nunca coloque a senha real neste arquivo: defina DB_PASSWORD no seu computador.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portal_mulheres}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# O banco é criado pelo script src/main/resources/db/schema.sql.
# "validate" só confere se as entidades batem com as tabelas; não altera o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

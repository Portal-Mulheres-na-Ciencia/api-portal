spring.application.name=PortalMulheresNaCiencia

# Conexão com o MySQL. Os valores vêm de variáveis de ambiente; o que está depois de ":" é o padrão local.
# Nunca coloque a senha real neste arquivo: defina DB_PASSWORD no seu computador.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portal_mulheres}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# O banco é criado pelo script src/main/resources/db/schema.sql.
# "validate" só confere se as entidades batem com as tabelas; não altera o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Endereços do front-end que podem chamar a API (separados por vírgula).
app.cors.origens=${CORS_ORIGENS:http://localhost:4200}

# Primeira conta da equipe, criada quando a tabela usuario está vazia (veja InicializadorUsuario).
# Defina ADMIN_EMAIL e ADMIN_SENHA no seu computador; a senha nunca fica neste arquivo.
app.admin.nome=${ADMIN_NOME:Equipe do Portal}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}

# Cookie da sessão de login: só o navegador envia, o JavaScript não lê.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

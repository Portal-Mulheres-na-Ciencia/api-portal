# Configuração usada só nos testes: banco H2 em memória, no modo compatível com MySQL.
# Assim os testes rodam sem precisar de um MySQL instalado.
spring.datasource.url=jdbc:h2:mem:portal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
